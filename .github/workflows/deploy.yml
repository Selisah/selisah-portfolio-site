name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test Before Deployment
    runs-on: ubuntu-latest
    env:
      TESTING: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create virtual environment
        run: python -m venv venv

      - name: Install dependencies
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          source venv/bin/activate
          ./run_test.sh

  deploy:
    name: Deploy Portfolio Site
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy-key.pem
          chmod 600 ~/.ssh/deploy-key.pem
          cat >> ~/.ssh/config <<EOF
          Host my-vps
            HostName ${{ secrets.SSH_IP }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy-key.pem
            StrictHostKeyChecking no
          EOF

      - name: Deploy site
        run: ssh my-vps "~/redeploy-site.sh"

      - name: Print container status
        run: >-
          ssh my-vps
          "cd ${{ secrets.PROJECT_ROOT }} &&
          docker compose -f docker-compose.prod.yml ps"

      - name: Send Discord success notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is not configured; skipping success notification."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"🚀 Deployment Successful — ${{ github.repository }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK"

      - name: Send Discord deployment failure notification
        if: ${{ failure() }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is not configured; skipping failure notification."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"🚨 Deployment Failed — ${{ github.repository }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK"

  notify-test-failure:
    name: Notify Discord About Test Failure
    needs: test
    if: ${{ always() && needs.test.result == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord test failure notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is not configured; skipping test failure notification."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"🚨 Deployment Failed during testing — ${{ github.repository }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK"
